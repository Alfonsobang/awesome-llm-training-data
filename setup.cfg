[metadata]
name = finagent-eval-seed
version = 0.1.0
description = Public-safe financial-agent evaluation seed with deterministic verifiers and scorecards.
long_description = file: README.md
long_description_content_type = text/markdown
license_files = LICENSE.md
author = Alfonsobang
url = https://github.com/Alfonsobang/awesome-llm-training-data
project_urls =
    Repository = https://github.com/Alfonsobang/awesome-llm-training-data
    Issues = https://github.com/Alfonsobang/awesome-llm-training-data/issues
keywords =
    agent-evaluation
    financial-ai
    llm-evaluation
    rag-evaluation
    data-governance
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3 :: Only
    Topic :: Scientific/Engineering :: Artificial Intelligence

[options]
py_modules = finagent_eval
python_requires = >=3.8
include_package_data = True

[options.entry_points]
console_scripts =
    finagent-eval = finagent_eval:main
