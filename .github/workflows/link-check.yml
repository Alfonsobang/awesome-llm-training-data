name: Markdown Links

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  markdown-link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Markdown links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --root-dir .
            --verbose
            --no-progress
            --max-concurrency 8
            --max-retries 5
            --retry-wait-time 3
            --timeout 30
            --accept '200,206,403,429,502'
            --exclude '^https://fred\.stlouisfed\.org/docs/api/fred/series_observations\.html$'
            './**/*.md'
          fail: true
