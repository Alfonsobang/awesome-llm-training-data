name: Resource Audit

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  resource-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Audit resource entries
        run: python tools/audit_resources.py --root .

      - name: Validate synthetic financial fixtures
        run: python tools/validate_synthetic_fixtures.py

      - name: Validate finance preference-review examples
        run: python tools/validate_finance_preference_reviews.py

      - name: Validate desired repository metadata
        run: python tools/validate_repo_metadata.py
