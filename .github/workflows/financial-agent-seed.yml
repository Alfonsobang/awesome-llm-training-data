name: Financial Agent Seed

on:
  push:
    paths:
      - "examples/financial-agent-eval-seed/**"
      - "finagent_eval.py"
      - "test_finagent_eval_cli.py"
      - "tools/validate_financial_benchmark_card.py"
      - ".github/workflows/financial-agent-seed.yml"
  pull_request:
    paths:
      - "examples/financial-agent-eval-seed/**"
      - "finagent_eval.py"
      - "test_finagent_eval_cli.py"
      - "tools/validate_financial_benchmark_card.py"
      - ".github/workflows/financial-agent-seed.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate financial agent evaluation seed
        run: python examples/financial-agent-eval-seed/validate_specs.py
      - name: Validate financial data-source governance
        run: python examples/financial-agent-eval-seed/validate_sources.py
      - name: Generate financial data-source governance report
        run: python examples/financial-agent-eval-seed/generate_source_governance_report.py
      - name: Generate repeated-trial example report
        run: python examples/financial-agent-eval-seed/aggregate_trial_reports.py
      - name: Generate financial-agent scorecard example
        run: python examples/financial-agent-eval-seed/build_scorecard.py --report examples/financial-agent-eval-seed/results/example-report.json --candidate reference-solutions --output-prefix examples/financial-agent-eval-seed/results/example-scorecard
      - name: Validate financial benchmark card
        run: python tools/validate_financial_benchmark_card.py
      - name: Run financial agent eval seed
        run: python examples/financial-agent-eval-seed/run_finance_eval.py
      - name: Run root financial-agent demo CLI
        run: python finagent_eval.py demo
      - name: Install and run finagent-eval console script
        run: python -m pip install -e . && finagent-eval demo
      - name: Test financial agent eval runner
        run: python -m unittest discover -s examples/financial-agent-eval-seed -p "test_*.py" && python -m unittest test_finagent_eval_cli.py
      - name: Validate Harbor-style financial task templates
        run: python examples/financial-agent-eval-seed/validate_harbor_templates.py
      - name: Validate Harbor-style task-pack manifest
        run: python examples/financial-agent-eval-seed/validate_task_pack_manifest.py
