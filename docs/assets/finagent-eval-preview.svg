<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
  <title id="title">Financial Agent Eval Toolkit preview</title>
  <desc id="desc">Terminal-style preview showing finagent-eval demo, a passing reference scorecard, and known-bad red flags.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102a2a"/>
      <stop offset="0.56" stop-color="#1d2d44"/>
      <stop offset="1" stop-color="#3a2f52"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1120" height="620" rx="0" fill="url(#bg)"/>
  <g opacity="0.18">
    <path d="M70 500 C220 410, 330 540, 490 430 S760 310, 1030 440" fill="none" stroke="#ffffff" stroke-width="2"/>
    <path d="M40 130 C230 210, 360 80, 570 165 S810 240, 1080 110" fill="none" stroke="#79e0c3" stroke-width="2"/>
  </g>

  <text x="64" y="78" fill="#f6f8fb" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">Financial Agent Eval Toolkit</text>
  <text x="64" y="115" fill="#b8c7d9" font-family="Segoe UI, Arial, sans-serif" font-size="18">Public-safe tasks, deterministic verifiers, scorecards, and Harbor-style templates</text>

  <g transform="translate(64,150)" filter="url(#shadow)">
    <rect width="620" height="386" rx="10" fill="#0c1117"/>
    <rect width="620" height="38" rx="10" fill="#202938"/>
    <circle cx="24" cy="19" r="6" fill="#ff6b6b"/>
    <circle cx="45" cy="19" r="6" fill="#ffd166"/>
    <circle cx="66" cy="19" r="6" fill="#4ecdc4"/>
    <text x="94" y="25" fill="#c8d3df" font-family="Consolas, Menlo, monospace" font-size="14">finagent-eval demo</text>

    <text x="28" y="78" fill="#8df0c7" font-family="Consolas, Menlo, monospace" font-size="17">$ python -m pip install -e .</text>
    <text x="28" y="110" fill="#8df0c7" font-family="Consolas, Menlo, monospace" font-size="17">$ finagent-eval demo</text>
    <text x="28" y="154" fill="#dce7f3" font-family="Consolas, Menlo, monospace" font-size="16">Wrote results/latest-report.json</text>
    <text x="28" y="184" fill="#dce7f3" font-family="Consolas, Menlo, monospace" font-size="16">Pass rate: 10/10 (1.0)</text>
    <text x="28" y="214" fill="#dce7f3" font-family="Consolas, Menlo, monospace" font-size="16">Dimension score: 12.0/12</text>
    <text x="28" y="244" fill="#dce7f3" font-family="Consolas, Menlo, monospace" font-size="16">Recommendation: strong public-safe seed performance</text>
    <text x="28" y="286" fill="#8df0c7" font-family="Consolas, Menlo, monospace" font-size="17">$ finagent-eval bad-demo</text>
    <text x="28" y="322" fill="#ffb4a2" font-family="Consolas, Menlo, monospace" font-size="16">Known-bad: 0/10, red flags detected</text>
    <text x="28" y="352" fill="#ffb4a2" font-family="Consolas, Menlo, monospace" font-size="16">source, citation, cutoff, tool trace, safety boundary</text>
  </g>

  <g transform="translate(728,150)" filter="url(#shadow)">
    <rect width="328" height="386" rx="10" fill="#f6f8fb"/>
    <text x="26" y="48" fill="#14213d" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Scorecard Dimensions</text>
    <text x="26" y="78" fill="#526174" font-family="Segoe UI, Arial, sans-serif" font-size="14">Generated from verifier evidence, not fluency.</text>

    <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
      <rect x="24" y="108" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="130" fill="#145c45">Source selection</text>
      <text x="252" y="130" fill="#145c45" text-anchor="end">2/2</text>

      <rect x="24" y="154" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="176" fill="#145c45">Citation support</text>
      <text x="252" y="176" fill="#145c45" text-anchor="end">2/2</text>

      <rect x="24" y="200" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="222" fill="#145c45">Numeric correctness</text>
      <text x="252" y="222" fill="#145c45" text-anchor="end">2/2</text>

      <rect x="24" y="246" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="268" fill="#145c45">Temporal discipline</text>
      <text x="252" y="268" fill="#145c45" text-anchor="end">2/2</text>

      <rect x="24" y="292" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="314" fill="#145c45">Tool trajectory</text>
      <text x="252" y="314" fill="#145c45" text-anchor="end">2/2</text>

      <rect x="24" y="338" width="280" height="34" rx="6" fill="#eaf7f2"/>
      <text x="42" y="360" fill="#145c45">Safety boundary</text>
      <text x="252" y="360" fill="#145c45" text-anchor="end">2/2</text>
    </g>
  </g>

  <text x="64" y="580" fill="#d2dde9" font-family="Segoe UI, Arial, sans-serif" font-size="15">No private data. No real user data. No investment advice. No production-readiness claim.</text>
</svg>
